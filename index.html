<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.min.js"></script>
    <title>Expense Tracker</title>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
         <div class="app-header">
            <div class="brand"><i class="fas fa-wallet"></i>Expense Tracker</div>
            <div class="header-actions">
                <button class="theme-btn" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button id="clearAllBtn"><i class="fas fa-trash-alt"></i><span>Clear All</span></button>
            </div>
         </div>

         <!--Stats-->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value balance" id="totalBalance">%0.00</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Income</div>
                <div class="stat-value income" id="totalIncome">%0.00</div>
            </div>

             <div class="stat-card">
                <div class="stat-label">Total Expenses</div>
                <div class="stat-value expenses" id="totalExpenses">%0.00</div>
            </div>
        </div>

        <!--Main GRID-->
        <div class="main-grid">

            <!--LEFT-->
            <div class="left-col">

                <!--Form-->
                <div class="add-form">
                    <h3><i class="fas fa-plus-circle" style="color: var(--accent);"></i>Add Transactiion</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="descInput" placeholder="e.g. Groceries">
                        </div>

                        <div class="form-group">
                            <label>Amount</label>
                            <input type="number" id="amountInput" placeholder="0.00" step="0.01">
                        </div>

                        <div class="form-group">
                            <label>Category</label>
                            <select id="categorySelect"> 
                                <option value="Food">🥪 Food</option>
                                <option value="Transport">🚋 Transport</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Bills">🎟️ Bills</option>
                                <option value="Entertainment">🥳 Entertainment</option>
                                <option value="Health">🏥 Health</option>
                                <option value="Education">📚 Education</option>
                                <option value="Salary">💼 Salary</option>
                                <option value="Other">📦 Other</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
